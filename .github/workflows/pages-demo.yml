name: Deploy demo to GitHub Pages

# The demo moved to public/demo, where the Worker serves it too. This workflow publishes
# the same files to GitHub Pages, from main only: a branch that never deploys does not
# need a deployment job that can fail.
on:
  push:
    branches: [main]
    paths:
      - "public/demo/**"
      - ".github/workflows/pages-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/demo
      - id: deployment
        uses: actions/deploy-pages@v4
