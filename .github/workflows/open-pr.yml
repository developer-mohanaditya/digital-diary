name: Open pull request from developer-fb

on:
  push:
    branches: [developer-fb]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open or update the PR into main
        env:
          # A pull request opened with GITHUB_TOKEN is authored by github-actions[bot], and a
          # squash merge then credits the bot as the commit author. PR_TOKEN is a personal
          # access token, so the PR and the squash commit belong to the repository owner.
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
        run: |
          git fetch origin main
          if git diff --quiet origin/main...HEAD; then
            echo "No changes compared with main. Nothing to open."
            exit 0
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The PR_TOKEN secret is not set. Add a personal access token with contents:read and pull-requests:write under Settings > Secrets and variables > Actions."
            exit 1
          fi

          existing=$(gh pr list --head developer-fb --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open for developer-fb. Its commits update automatically."
            exit 0
          fi

          title=$(git log -1 --format='%s')
          {
            echo "Changes on developer-fb since main:"
            echo
            git log --format='- %s' origin/main..HEAD
          } > pr-body.md

          gh pr create --base main --head developer-fb --title "$title" --body-file pr-body.md
