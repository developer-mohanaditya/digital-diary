<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Preview v2 · Digital Diary</title>
<link rel="icon" href="../logo/mark.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400..800&family=Hanken+Grotesk:wght@400..700&family=Space+Grotesk:wght@400..700&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet" />
<style>
  /* Palettes: theme x mode. Card shape (hard shadow) is shared by all themes. */
  [data-theme="minimal"][data-mode="light"] { --bg:#eef1ff; --ink:#0d1020; --muted:#5b6382; --accent:#4338ca; --card:#ffffff; --line:#d9ddf2; --alert:#e11d48; --edge:#0d1020; --shadow:#0d1020; --top:#0d1020; --grain:none; }
  [data-theme="minimal"][data-mode="dark"]  { --bg:#15122b; --ink:#f1eeff; --muted:#a7a1d6; --accent:#a78bfa; --card:#1e1a3d; --line:#342e66; --alert:#fb7185; --edge:#6d5bd0; --shadow:#6d5bd0; --top:#0c0a1f;
    --grain:radial-gradient(1100px 620px at 8% -12%, rgba(167,139,250,.22), transparent 60%), radial-gradient(900px 520px at 100% 0%, rgba(99,102,241,.16), transparent 60%); }
  [data-theme="paper"][data-mode="light"]   { --bg:#fbfaf6; --ink:#24231f; --muted:#8b877d; --accent:#c26a3d; --card:#ffffff; --line:#ebe7dd; --alert:#e0454b; --edge:#24231f; --shadow:#e3dccb; --top:#2b2a26; --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  [data-theme="paper"][data-mode="dark"]   { --bg:#1d1a16; --ink:#f3ece0; --muted:#a39a8a; --accent:#e0a46b; --card:#26221d; --line:#3d362d; --alert:#f07171; --edge:#5a5044; --shadow:#5a5044; --top:#14110d; --grain:none; }
  [data-theme="journal"][data-mode="light"] { --bg:#f5f2ea; --ink:#1c1f26; --muted:#6b7280; --accent:#b7791f; --card:#ffffff; --line:#e3e0d8; --alert:#dc2626; --edge:#1c1f26; --shadow:#e2b96e; --top:#1c1f26; --grain:none; }
  [data-theme="journal"][data-mode="dark"]  { --bg:#14161b; --ink:#ece9e2; --muted:#8a8f9a; --accent:#f0b66a; --card:#1d2027; --line:#2c303a; --alert:#ff6b6b; --edge:#3a3f4b; --shadow:#f0b66a; --top:#0f1115; --grain:none; }

  /* Fonts. Minimal and Dark Journal use Grotesk; Paper uses its own pair. Minimal font is unchanged. */
  [data-theme="minimal"], [data-theme="journal"] { --head:"Space Grotesk", Arial, sans-serif; --font:"Instrument Sans", Arial, sans-serif; }
  [data-theme="paper"] { --head:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; --font:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif; }
  /* Setup-page font choice overrides the theme default (applied only when set). */
  [data-font="grotesk"] { --head:"Space Grotesk", Arial, sans-serif; --font:"Instrument Sans", Arial, sans-serif; }
  [data-font="paper"] { --head:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; --font:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif; }
  [data-font="system"] { --head:system-ui, -apple-system, sans-serif; --font:system-ui, -apple-system, sans-serif; }

  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background-color:var(--bg); background-image:var(--grain);
    color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.5; transition:background-color .25s, color .25s; }
  h1,h2,.brand { font-family:var(--head); letter-spacing:-0.01em; }
  a { color:inherit; text-decoration:none; }
  button, select, textarea { font:inherit; }

  .top { position:sticky; top:0; z-index:5; padding:12px 0; background:var(--top); color:#f5f5ff; }
  .top-inner { width:min(1100px,100%); margin:0 auto; padding:0 24px; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px; }
  .brand { font-weight:800; font-size:1.05rem; display:inline-flex; align-items:center; gap:10px; justify-self:start; white-space:nowrap; }
  .brand img { display:block; width:36px; height:36px; border-radius:10px; }
  /* The wordmark carries the demo's yellow, so the bar needs no badge beside it. */
  .brand-name { display:inline; color:#fbbf24; }
  .tools { display:flex; gap:8px; align-items:center; justify-self:end; }
  .search-wrap { position:relative; width:100%; max-width:560px; min-width:0; margin:0; justify-self:center; }
  .search-input { position:relative; z-index:0; width:100%; height:38px; color:#f5f5ff; border-radius:999px; padding:8px 14px 8px 37px; font-size:.88rem; outline:none;
    background:linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,.06) 45%, rgba(255,255,255,.14));
    -webkit-backdrop-filter:blur(20px) saturate(1.8); backdrop-filter:blur(20px) saturate(1.8);
    border:1px solid rgba(255,255,255,.38);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), inset 0 1px 1px rgba(255,255,255,.55), inset 0 -2px 5px rgba(0,0,0,.18);
    transition:border-color .2s, box-shadow .2s; }
  .search-input::placeholder { color:rgba(245,245,255,.62); }
  .search-input:focus { border-color:rgba(255,255,255,.68);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12), inset 0 1px 1px rgba(255,255,255,.6), inset 0 -2px 5px rgba(0,0,0,.18); }
  .search-input::-webkit-search-cancel-button { filter:invert(1); opacity:.65; }
  .search-wrap::before { content:""; position:absolute; inset:0; border-radius:999px; pointer-events:none; z-index:1;
    background:radial-gradient(ellipse 75% 70% at 50% -20%, rgba(255,255,255,.5), rgba(255,255,255,0) 65%); }
  .search-wrap::after { content:""; position:absolute; inset:0; border-radius:999px; pointer-events:none; z-index:1;
    background:radial-gradient(ellipse 70% 55% at 50% 118%, rgba(255,255,255,.16), rgba(255,255,255,0) 60%); }
  .search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); z-index:2; display:block; width:16px; height:16px;
    color:#fff; opacity:.85; pointer-events:none; }
  .search-pop { position:absolute; top:calc(100% + 8px); left:0; right:0; background:var(--card); color:var(--ink);
    border:2px solid var(--edge); border-radius:14px; z-index:30;
    max-height:min(60vh,380px); overflow-y:auto; }
  .search-pop[hidden] { display:none; }
  .srow { display:flex; gap:9px; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line);
    padding:9px 12px; cursor:pointer; color:inherit; align-items:flex-start; font-size:.85rem; }
  .srow:last-child { border-bottom:0; }
  .srow:hover, .srow.active { background:color-mix(in srgb, var(--accent) 9%, transparent); }
  .srow .sdot { margin-top:5px; flex-shrink:0; }
  .srow .stxt { min-width:0; flex:1; display:flex; flex-direction:column; gap:3px; }
  .srow .st1 { font-weight:700; font-size:.86rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .srow .sline { display:flex; gap:10px; align-items:baseline; min-width:0; }
  .srow .ssnip { flex:1; min-width:0; font-size:.8rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .srow mark { background:color-mix(in srgb, var(--accent) 28%, transparent); border-radius:3px; padding:0 1px; color:inherit; }
  .srow .smeta2 { flex:0 0 auto; font-size:.7rem; color:var(--muted); white-space:nowrap; }
  .sempty { padding:12px 14px; font-size:.85rem; color:var(--muted); }
  /* Liquid glass controls: tinted gradient + blur/saturate frost + rim light + specular curve (CSS translation of the liquid-glass-js recipe). */
  .iconbtn[hidden] { display:none; }
  .iconbtn { position:relative; width:38px; height:38px; border-radius:999px; display:grid; place-items:center; cursor:pointer; color:#f5f5ff; padding:0; overflow:hidden;
    background:linear-gradient(135deg, rgba(255,255,255,.24), rgba(255,255,255,.07) 45%, rgba(255,255,255,.15));
    -webkit-backdrop-filter:blur(20px) saturate(1.8); backdrop-filter:blur(20px) saturate(1.8);
    border:1px solid rgba(255,255,255,.38);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), inset 0 1px 1px rgba(255,255,255,.6), inset 0 -2px 4px rgba(255,255,255,.10);
    transition:border-color .2s, box-shadow .2s, transform .15s; }
  .iconbtn:hover { border-color:rgba(255,255,255,.65); }
  .iconbtn:active { transform:scale(.94); }
  .iconbtn::before { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(ellipse 90% 55% at 50% -5%, rgba(255,255,255,.6), rgba(255,255,255,0) 65%); }
  .iconbtn::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(ellipse 80% 45% at 50% 112%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%); }
  .iconbtn svg { position:relative; z-index:1; }
  .iconbtn:hover, .iconbtn[aria-expanded="true"] { border-color:#f5f5ff; }
  .iconbtn svg { width:18px; height:18px; }

  main { flex:1; width:min(1100px,100%); margin:0 auto; padding:16px 24px 40px; }
  /* The trail, and the day's counters sharing its row. */
  .crumbrow { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:18px; }
  .crumbrow[hidden] { display:none; }
  .crumbs { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:.76rem; color:var(--muted); letter-spacing:.01em; }
  .crumbs a:hover { color:var(--accent); }
  .crumbs .sep { opacity:.5; }
  .crumbs [aria-current="page"] { color:var(--ink); font-weight:700; }
  .crumbtools { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-left:auto; }

  .card { background:var(--card); border:2px solid var(--edge); box-shadow:4px 4px 0 var(--shadow); border-radius:18px; padding:18px 20px; margin-bottom:18px; }
  .card h2 { margin:0 0 12px; font-size:1.05rem; font-weight:700; }
  .kicker { font-size:.7rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); font-weight:700; }
  .hero h1 { font-size:clamp(1.9rem,4.4vw,2.9rem); margin:4px 0 6px; line-height:1.05; font-weight:800; letter-spacing:-.02em; }
  .muted { color:var(--muted); }

  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:18px; }
  .kpi { background:var(--card); border:2px solid var(--edge); box-shadow:4px 4px 0 var(--shadow); border-radius:18px; padding:14px 16px; }
  .kpi b { display:block; font-family:var(--head); font-size:1.8rem; font-weight:800; }
  .kpi span { font-size:.8rem; color:var(--muted); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .grid2 > .card { min-width:0; }
  @media (max-width:800px) { .grid2 { grid-template-columns:1fr; } .top { padding:12px 0; } .top-inner { padding:0 16px; } main { padding:14px 16px 36px; } }

  .navrow { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .act-title { flex:1 1 auto; min-width:0; }
  .act-datenav { display:flex; gap:8px; align-items:center; margin:0; flex:0 0 auto; margin-left:auto; }
  .act-head .seg { flex:0 0 auto; }
  .seg { display:inline-flex; gap:2px; padding:3px; border-radius:999px; border:1.5px solid var(--line); background:var(--bg); max-width:100%; }
  .seg button { background:transparent; border:0; color:var(--muted); border-radius:999px; padding:4px 12px; cursor:pointer; font-size:.85rem; white-space:nowrap; flex:0 0 auto; }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--card); }
  .btn { background:var(--card); color:var(--ink); border:1.5px solid var(--line); border-radius:10px; padding:5px 12px; cursor:pointer; font-size:.88rem; display:inline-block; }
  .btn:hover { border-color:var(--accent); }
  .link { background:none; border:0; color:var(--accent); cursor:pointer; padding:0; font-weight:700; font-size:.82rem; }
  /* A text link that opens a page: a tinted label, not a card. Flat fill and one accent stroke. */
  .microbtn { display:inline-flex; align-items:center; gap:5px; text-decoration:none; white-space:nowrap;
    background:color-mix(in srgb, var(--accent) 10%, transparent); color:var(--accent);
    border:1.5px solid color-mix(in srgb, var(--accent) 38%, transparent);
    border-radius:7px; padding:3.5px 8px; font-size:.7rem; font-weight:800;
    text-transform:uppercase; letter-spacing:.07em; transition:background .12s, color .12s, border-color .12s; }
  .microbtn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .microbtn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .chart { width:100%; height:auto; display:block; }
  .chart .grid { stroke:var(--line); stroke-dasharray:2 4; }
  .chart .axis { fill:var(--muted); font-size:11px; font-family:var(--font); }
  .chart .bar { fill:var(--accent); }
  .chart .out { fill:var(--alert); }
  .comp .bar { display:flex; height:10px; border-radius:99px; overflow:hidden; background:var(--line); gap:2px; }
  .comp .bar span { height:100%; }
  .keys { display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:12px; font-size:.86rem; }
  .k { display:inline-flex; align-items:center; gap:7px; }
  .k i { width:8px; height:8px; border-radius:50%; }
  .k em { font-style:normal; color:var(--muted); font-variant-numeric:tabular-nums; }
  .donut { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .donut svg { width:150px; height:150px; flex-shrink:0; }
  .donut .comp { flex:1; min-width:200px; }
  .donut .comp .bar { display:none; }
  .donut .keys { flex-direction:column; gap:8px; margin-top:0; }
  .dtot { font-family:var(--head); font-size:22px; font-weight:800; fill:var(--ink); }

  .folders { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
  @media (max-width:950px) { .folders { grid-template-columns:repeat(4,1fr); } }
  @media (max-width:680px) { .folders { grid-template-columns:repeat(3,1fr); } }
  .folder { background:var(--card); border:2px solid var(--edge); box-shadow:3px 3px 0 var(--shadow); border-radius:16px; padding:12px 14px; }
  .folder:hover { transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--accent); }
  .folder strong { display:block; font-family:var(--head); font-size:1.02rem; }
  .folder span { font-size:.82rem; color:var(--muted); }
  .folder.off { opacity:.4; pointer-events:none; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }

  .heat { display:grid; gap:4px; max-width:100%; overflow:hidden; }
  .heat .hrow { display:grid; grid-template-columns:34px repeat(31, minmax(0,1fr)); gap:3px; align-items:center; }
  .hm { font-size:.7rem; color:var(--muted); }
  .hc { width:100%; aspect-ratio:1; border-radius:2px; background:var(--line); outline:1px solid color-mix(in srgb, var(--ink) 8%, transparent); outline-offset:-1px; }
  .hc.l1 { background:color-mix(in srgb, var(--accent) 30%, var(--card)); }
  .hc.l2 { background:color-mix(in srgb, var(--accent) 55%, var(--card)); }
  .hc.l3 { background:color-mix(in srgb, var(--accent) 80%, var(--card)); }
  .hc.l4 { background:var(--accent); }
  .hc.na { opacity:.25; pointer-events:none; }
  .hc.blank { background:transparent; }

  .cal { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
  .dow { font-size:.72rem; color:var(--muted); text-align:center; }
  .cell { min-width:0; min-height:64px; border:1.5px solid var(--line); border-radius:12px; padding:6px 8px; display:flex; flex-direction:column; justify-content:space-between; background:var(--bg); }
  .cell:hover { border-color:var(--accent); }
  .cell b { font-weight:700; }
  .cell small { font-size:.72rem; color:var(--muted); }
  .cell.blank { border:none; background:transparent; }
  .cell.l1 { background:color-mix(in srgb, var(--accent) 22%, var(--card)); }
  .cell.l2 { background:color-mix(in srgb, var(--accent) 40%, var(--card)); }
  .cell.l3 { background:color-mix(in srgb, var(--accent) 60%, var(--card)); }
  .cell.l4 { background:color-mix(in srgb, var(--accent) 80%, var(--card)); color:#fff; }
  .cell.l4 small { color:#fff; }

  .summary p { margin:0 0 8px; }
  .summary .note { font-size:.8rem; color:var(--muted); }

  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .tab { background:var(--bg); color:var(--ink); border:1.5px solid var(--line); border-radius:999px; padding:3px 10px; cursor:pointer; font-size:.78rem; }
  .tabs-inline { margin:0 0 0 auto; justify-content:flex-end; }
  .subrow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0 0; }
  .subrow p { margin:0; }
  .dayhead { margin-bottom:16px; }
  .daynav { display:flex; align-items:center; gap:10px; }
  .daytitle { flex:1 1 auto; min-width:0; text-align:center; margin:0; font-family:var(--head); font-weight:800; letter-spacing:-.02em;
    font-size:clamp(1.25rem,3.2vw,1.8rem); display:flex; flex-wrap:nowrap; align-items:baseline; justify-content:center; gap:.45em; }
  .daytitle .dow, .daytitle .dmy { white-space:nowrap; }
  .daytitle .dow { font-size:.62em; font-weight:700; text-transform:uppercase; letter-spacing:.16em; color:inherit; }
  .daynav .bl-short { display:none; }
  .daynav .btn { flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; gap:6px; min-width:136px; }
  .daynav .btn svg { width:14px; height:14px; flex-shrink:0; }
  .tab:hover { border-color:var(--accent); }
  .tab[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tab small { opacity:.75; margin-left:5px; }
  .tab.zero { opacity:.45; }
  .utabs { display:flex; flex-wrap:wrap; gap:4px 16px; border-bottom:1.5px solid var(--line); padding-bottom:2px; margin:0 0 0 auto; }
  .utabs button { background:none; border:0; border-bottom:2.5px solid transparent; margin-bottom:-1.75px; padding:6px 2px; cursor:pointer; font-size:.86rem; color:var(--muted); font-weight:600; }
  .utabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
  .utabs button sup { font-size:.68rem; margin-left:3px; }
  .utabs.colorful button sup { font-size:.72rem; font-weight:800; margin-left:4px; color:var(--c); }
  .utabs.colorful button[aria-selected="true"] { border-bottom-color:var(--c); }
  .ctabs { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 0 auto; justify-content:flex-end; }
  .ctabs button { display:inline-flex; align-items:center; gap:7px; background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:4px 10px; cursor:pointer; font-size:.8rem; color:var(--ink); }
  .ctabs button i { width:8px; height:8px; border-radius:50%; background:var(--c); }
  .ctabs button em { font-style:normal; color:var(--muted); font-size:.74rem; }
  .ctabs button[aria-selected="true"] { border-color:var(--c); }
  .segbar { display:flex; gap:2px; padding:3px; border-radius:14px; border:1.5px solid var(--line); background:var(--bg); overflow-x:auto; margin:0 0 0 auto; max-width:100%; }
  .segbar button { flex:1 0 auto; background:transparent; border:0; border-radius:10px; padding:6px 10px; cursor:pointer; font-size:.8rem; color:var(--muted); white-space:nowrap; }
  .segbar button[aria-selected="true"] { background:var(--ink); color:var(--card); font-weight:700; }
  .dday select { appearance:none; -webkit-appearance:none; background:var(--bg); color:var(--ink); border:1.5px solid var(--line); border-radius:999px; padding:5px 14px; font-size:.84rem; cursor:pointer; max-width:100%; }

  .entry { background:var(--card); border:2px solid var(--edge); box-shadow:4px 4px 0 var(--shadow); border-left:10px solid var(--c); border-radius:18px; padding:14px 16px; margin-bottom:12px; }
  .meta { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:.8rem; color:var(--muted); }
  .time { font-variant-numeric:tabular-nums; font-weight:700; color:var(--ink); }
  .chip { background:var(--c); color:#fff; border-radius:6px; padding:1px 8px; font-weight:700; font-size:.76rem; }
  .mode { border:1.5px solid var(--line); border-radius:999px; padding:0 8px; font-size:.74rem; }
  .rawtag { margin-left:auto; background:transparent; border:1.5px dashed var(--line); color:var(--muted); border-radius:999px; padding:0 10px; font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
  .rawtag:hover { border-color:var(--accent); color:var(--accent); }
  .rawtag[aria-pressed="true"] { border-style:solid; border-color:var(--accent); color:var(--accent); }
  .entry p { margin:8px 0 0; font-size:1rem; white-space:pre-wrap; }
  /* The formatted note: paragraphs and lists from the cleanup, never raw HTML. */
  .rtext { margin-top:8px; font-size:1rem; line-height:1.55; }
  .rtext p { margin:0 0 .6em; }
  .rtext p:last-child { margin-bottom:0; }
