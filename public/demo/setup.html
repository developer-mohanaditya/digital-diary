<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Setup · INK</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400..800&family=Hanken+Grotesk:wght@400..700&family=Space+Grotesk:wght@400..700&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet" />
<style>
  [data-theme="minimal"][data-mode="light"] { --bg:#eef1ff; --ink:#0d1020; --muted:#5b6382; --accent:#4338ca; --card:#ffffff; --line:#d9ddf2; --edge:#0d1020; --top:#0d1020; }
  [data-theme="minimal"][data-mode="dark"]  { --bg:#15122b; --ink:#f1eeff; --muted:#a7a1d6; --accent:#a78bfa; --card:#1e1a3d; --line:#342e66; --edge:#6d5bd0; --top:#0c0a1f; }
  [data-theme="paper"][data-mode="light"]   { --bg:#fbfaf6; --ink:#24231f; --muted:#8b877d; --accent:#c26a3d; --card:#ffffff; --line:#ebe7dd; --edge:#24231f; --top:#2b2a26; }
  [data-theme="paper"][data-mode="dark"]    { --bg:#1d1a16; --ink:#f3ece0; --muted:#a39a8a; --accent:#e0a46b; --card:#26221d; --line:#3d362d; --edge:#5a5044; --top:#14110d; }
  [data-theme="journal"][data-mode="light"] { --bg:#f5f2ea; --ink:#1c1f26; --muted:#6b7280; --accent:#b7791f; --card:#ffffff; --line:#e3e0d8; --edge:#1c1f26; --top:#1c1f26; }
  [data-theme="journal"][data-mode="dark"]  { --bg:#14161b; --ink:#ece9e2; --muted:#8a8f9a; --accent:#f0b66a; --card:#1d2027; --line:#2c303a; --edge:#3a3f4b; --top:#0f1115; }
  [data-font="grotesk"] { --head:"Space Grotesk", Arial, sans-serif; --font:"Instrument Sans", Arial, sans-serif; }
  [data-font="paper"]   { --head:"Bricolage Grotesque", Arial, sans-serif; --font:"Hanken Grotesk", Arial, sans-serif; }
  [data-font="system"]  { --head:system-ui, sans-serif; --font:system-ui, sans-serif; }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.5; }
  h1,h2 { font-family:var(--head); letter-spacing:-.01em; }
  button, select { font:inherit; }
  main { width:min(1280px,100%); margin:0 auto; padding:20px 20px 48px; }
  .top { position:sticky; top:0; z-index:5; padding:12px 0; background:var(--top); color:#f5f5ff; }
  .top-inner { width:min(1280px,100%); margin:0 auto; padding:0 20px; display:flex; align-items:center; justify-content:flex-start; gap:10px; }
  .brand { display:inline-flex; align-items:center; flex:0 0 auto; }
  .brand img { display:block; width:34px; height:34px; border-radius:8px; }
  .navtitle { font-family:var(--head); font-weight:800; font-size:1.02rem; flex:0 0 auto; }
  .navbtn { margin-left:auto; color:#f5f5ff; border-radius:999px; padding:7px 16px; font-size:.86rem; font-weight:700;
    background:linear-gradient(135deg, rgba(255,255,255,.24), rgba(255,255,255,.07) 45%, rgba(255,255,255,.15));
    -webkit-backdrop-filter:blur(20px) saturate(1.8); backdrop-filter:blur(20px) saturate(1.8);
    border:1px solid rgba(255,255,255,.38);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), inset 0 1px 1px rgba(255,255,255,.6); }
  .sub { color:var(--muted); margin:0 0 18px; font-size:.92rem; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .grid { display:grid; grid-template-columns:300px minmax(0,1fr); gap:18px; align-items:start; }
  .grid > div { display:flex; flex-direction:column; gap:18px; min-width:0; }
  @media (min-width:1500px) {
    main { width:min(1500px,100%); }
    .grid { grid-template-columns:300px minmax(0,1fr) 300px; }
  }
  @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:2px solid var(--edge); border-radius:18px; padding:18px 20px; margin-bottom:0; }
  .card > *:last-child { margin-bottom:0; }
  .kicker { font-size:.7rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); font-weight:700; font-family:var(--head); }
  .card h2 { margin:2px 0 12px; font-size:1.05rem; }
  .opt-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .opt { background:var(--bg); color:var(--ink); border:1.5px solid var(--line); border-radius:999px; padding:4px 12px; cursor:pointer; font-size:.82rem; }
  .opt[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  .swatches { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:0; }
  .sw { width:30px; height:30px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; }
  .sw[aria-pressed="true"] { border-color:var(--ink); }
  .catrows { display:grid; gap:6px; }
  .catrow { display:flex; align-items:center; gap:10px; font-size:.86rem; }
  .catrow i { width:10px; height:10px; border-radius:50%; }
  .catrow span { flex:1; }
  .catrow input[type="color"] { width:34px; height:26px; border:0; border-radius:10px; background:none; padding:0; cursor:pointer; }
  .catrow input[type="color"]::-webkit-color-swatch-wrapper { padding:0; }
  .catrow input[type="color"]::-webkit-color-swatch { border:0; border-radius:10px; }
  .catrow input[type="color"]::-moz-color-swatch { border:0; border-radius:10px; }
  .reset { background:none; border:1.5px dashed var(--line); color:var(--muted); border-radius:10px; padding:5px 12px; cursor:pointer; font-size:.84rem; width:100%; }
  .reset:hover { border-color:var(--accent); color:var(--accent); }

  /* Range-control rhythm: keep chip-style controls visually close to their label so the card reads as one block, not a sparse header + far controls. */
  .opt-row:last-child { margin-bottom:0; }
  .swatches + .opt-row, .opt-row + .swatches { margin-top:6px; }


  /* preview */
  .daynav { display:flex; align-items:center; gap:10px; }
  .daytitle { flex:1; text-align:center; margin:0; font-family:var(--head); font-weight:800; font-size:1.3rem; display:flex; flex-direction:column; line-height:1.22; }
  .daytitle .dow { font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.16em; }
  .daytitle .dow, .daytitle .dmy { white-space:nowrap; }
  .pbtn { flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; background:var(--card); color:var(--ink); border:1.5px solid var(--line); border-radius:10px; padding:5px 10px; font-size:.8rem; }
  .pbtn svg { width:14px; height:14px; }
  .lhead { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:16px 0 12px; }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 0 auto; justify-content:flex-end; }
  .tab { background:var(--bg); color:var(--ink); border:1.5px solid var(--line); border-radius:999px; padding:3px 10px; cursor:pointer; font-size:.78rem; }
  .tab[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tab small { opacity:.75; margin-left:4px; }
  .uline { display:flex; flex-wrap:wrap; gap:4px 18px; border-bottom:1.5px solid var(--line); padding-bottom:2px; margin:0 0 0 auto; }
  .uline button { background:none; border:0; border-bottom:2.5px solid transparent; margin-bottom:-1.75px; padding:6px 2px; cursor:pointer; font-size:.86rem; color:var(--muted); font-weight:600; }
  .uline button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
  .uline button sup { font-size:.68rem; margin-left:3px; }
  .uline.colorful button sup { font-size:.72rem; font-weight:800; margin-left:4px; color:var(--c); }
  .uline.colorful button[aria-selected="true"] { border-bottom-color:var(--c); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 0 auto; justify-content:flex-end; }
  .chips button { display:inline-flex; align-items:center; gap:7px; background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:4px 10px; cursor:pointer; font-size:.8rem; color:var(--ink); }
  .chips button i { width:8px; height:8px; border-radius:50%; background:var(--c); }
  .chips button em { font-style:normal; color:var(--muted); font-size:.74rem; }
  .chips button[aria-selected="true"] { border-color:var(--c); background:color-mix(in srgb, var(--c) 12%, white); }
  .segbar { display:flex; gap:2px; padding:3px; border-radius:14px; border:1.5px solid var(--line); background:var(--bg); overflow-x:auto; margin:0 0 0 auto; max-width:100%; }
  .segbar button { flex:1 0 auto; background:transparent; border:0; border-radius:10px; padding:6px 10px; cursor:pointer; font-size:.8rem; color:var(--muted); white-space:nowrap; }
  .segbar button[aria-selected="true"] { background:var(--ink); color:var(--card); font-weight:700; }
  .dd select { appearance:none; -webkit-appearance:none; background:var(--bg); color:var(--ink); border:1.5px solid var(--line); border-radius:999px; padding:5px 14px; font-size:.84rem; }
  .lgrp { font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:800; margin:14px 0 2px; }
  .lrow { display:flex; gap:10px; padding:7px 2px; border-top:1px solid var(--line); font-size:.9rem; }
  .ltime { flex:0 0 44px; font-size:.78rem; color:var(--muted); }
  .gdot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:7px; }
</style>
</head>
<body data-theme="minimal" data-mode="light" data-font="grotesk">
<header class="top"><div class="top-inner">
  <a class="brand" href="/" aria-label="Back to dashboard"><img src="logo/mark.svg" width="34" height="34" alt="INK logo" /></a>
  <span class="navtitle">Setup</span>
  <a class="navbtn" href="/">← Dashboard</a>
</div></header>
<main>
  <h1>Setup</h1>
  <p class="sub">Tune the controls, watch the preview. Defaults match the app today. Saved in this browser only.</p>
  <div class="grid">
    <div>
      <section class="card"><span class="kicker">Theme</span><h2>Look</h2><div class="opt-row" id="c-theme"></div>
        <div class="opt-row" id="c-mode"></div></section>
      <section class="card"><span class="kicker">Categories</span><h2>Chip variant</h2><div class="opt-row" id="c-chips"></div></section>
      <section class="card"><span class="kicker">Color</span><h2>Accent</h2><div class="swatches" id="c-accent"></div></section>
    </div>
    <div>
      <section class="card"><span class="kicker">Live preview · sample day</span>
        <div id="preview"></div>
      </section>
    </div>
    <div class="rightcol">
      <section class="card"><span class="kicker">Type</span><h2>Font</h2><div class="opt-row" id="c-font"></div></section>
      <section class="card"><span class="kicker">Colors</span><h2>Categories</h2><div class="catrows" id="c-cats"></div></section>
      <button class="reset" id="c-reset" type="button">Reset everything to app defaults</button>
    </div>
  </div>
</main>
<script>
const CATS = [
  { id:'class', label:'Class' }, { id:'learning', label:'Learning' }, { id:'thought', label:'Thought' },
  { id:'quote', label:'Quote' }, { id:'work', label:'Work' }, { id:'project', label:'Project' },
  { id:'life', label:'Life' }, { id:'task', label:'Task' }, { id:'deadline', label:'Deadline' }, { id:'inbox', label:'Inbox' },
];
const COUNTS = { class:1, learning:2, thought:1, project:1, life:1, inbox:1 };
const ROWS = [
  { cat:'class', time:'12:32', text:'Algorithms: amortized analysis of dynamic arrays.' },
  { cat:'learning', time:'09:17', text:'Read about backpressure: the queue size is the real knob.' },
  { cat:'learning', time:'09:43', text:'A hash index cannot answer range queries. Obvious now, not at 2am.' },
  { cat:'thought', time:'13:33', text:'Real progress comes from small, repeated steps.' },
  { cat:'project', time:'19:12', text:'Diary schema: added the categories table.' },
  { cat:'life', time:'08:05', text:'Gym, slept seven hours. Energy felt steady.' },
  { cat:'inbox', time:'22:40', text:'Unsorted idea about a monthly review ritual.' },
];
const DEFAULTS = {
  theme:'minimal', mode:'light', chips:'pills', accent:'#4338ca', font:'grotesk',
  cats:{ class:'#4f6ef7', learning:'#14a37f', thought:'#e8a33d', quote:'#c2578a', work:'#64748b', project:'#8b5cf6', life:'#f0643c', task:'#0ea5b7', deadline:'#e5484d', inbox:'#9ca3af' },
};
const THEMES = [['minimal','Minimal'],['paper','Paper'],['journal','Journal']];
const MODES = [['light','Light'],['dark','Dark']];
const CHIPS = [['pills','Pills'],['underline','Underline'],['colorline','Color line'],['dotchips','Dot chips'],['segmented','Segmented'],['dropdown','Dropdown']];
const FONTS = [['grotesk','Grotesk'],['paper','Paper serif'],['system','System']];
const ACCENTS = ['#4338ca','#c26a3d','#b7791f','#0ea5b7','#c2578a','#14a37f'];
const KEY = 'diary-setup-v1';
let cfg = { ...DEFAULTS, cats:{ ...DEFAULTS.cats } };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) { cfg = { ...cfg, ...s, cats:{ ...cfg.cats, ...(s.cats||{}) } }; } } catch (_) {}
let sel = 'all';
const $ = s => document.querySelector(s);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (_) {} };

function optRow(el, options, cur, fn) {
  el.innerHTML = options.map(([v, l]) => `<button type="button" class="opt" data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => fn(b.dataset.v)));
}
function controls() {
  optRow($('#c-theme'), THEMES, cfg.theme, v => { cfg.theme = v; sync(); });
  optRow($('#c-mode'), MODES, cfg.mode, v => { cfg.mode = v; sync(); });
  optRow($('#c-chips'), CHIPS, cfg.chips, v => { cfg.chips = v; sync(); });
  optRow($('#c-font'), FONTS, cfg.font, v => { cfg.font = v; sync(); });
  $('#c-accent').innerHTML = ACCENTS.map(a => `<button type="button" class="sw" data-v="${a}" aria-pressed="${a === cfg.accent}" title="${a}" style="background:${a}"></button>`).join('');
  $('#c-accent').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { cfg.accent = b.dataset.v; sync(); }));
  $('#c-cats').innerHTML = CATS.map(c => `<label class="catrow"><i style="background:${cfg.cats[c.id]}"></i><span>${c.label}</span><input type="color" data-cat="${c.id}" value="${cfg.cats[c.id]}" /></label>`).join('');
  $('#c-cats').querySelectorAll('input').forEach(i => i.addEventListener('input', () => { cfg.cats[i.dataset.cat] = i.value; sync(false); }));
}
function chipsHTML() {
  const defs = [{ id:'all', label:'All', n:7 }, ...CATS.filter(c => COUNTS[c.id] > 0).map(c => ({ ...c, n:COUNTS[c.id] }))];
  const col = id => id === 'all' ? cfg.accent : cfg.cats[id];
  if (cfg.chips === 'underline' || cfg.chips === 'colorline') {
    const cls = cfg.chips === 'colorline' ? 'uline colorful' : 'uline';
    return `<div class="${cls}">` + defs.map(d => `<button type="button" data-f="${d.id}" aria-selected="${sel === d.id}"${cfg.chips === 'colorline' ? ` style="--c:${col(d.id)}"` : ''}>${d.label}<sup>${d.n}</sup></button>`).join('') + '</div>';
  }
  if (cfg.chips === 'dotchips') {
    return `<div class="chips">` + defs.map(d => `<button type="button" data-f="${d.id}" aria-selected="${sel === d.id}" style="--c:${col(d.id)}"><i></i>${d.label}<em>${d.n}</em></button>`).join('') + '</div>';
  }
  if (cfg.chips === 'segmented') {
    return `<div class="segbar">` + defs.map(d => `<button type="button" data-f="${d.id}" aria-selected="${sel === d.id}">${d.label}<small> ${d.n}</small></button>`).join('') + '</div>';
  }
  if (cfg.chips === 'dropdown') {
    return `<div class="dd"><select id="pv-sel" aria-label="Filter by category">` + defs.map(d => `<option value="${d.id}"${sel === d.id ? ' selected' : ''}>${d.label} · ${d.n}</option>`).join('') + '</select></div>';
  }
  return `<div class="tabs">` + defs.map(d => `<button type="button" class="tab" data-f="${d.id}" aria-selected="${sel === d.id}">${d.label}<small>${d.n}</small></button>`).join('') + '</div>';
}
function preview() {
  const rows = sel === 'all' ? ROWS : ROWS.filter(r => r.cat === sel);
  const groups = [...new Set(rows.map(r => r.cat))];
  $('#preview').innerHTML = `
    <div class="daynav">
      <span class="pbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Prev</span>
      <h1 class="daytitle"><span class="dow">Thursday</span><span class="dmy">13 Aug 26</span></h1>
      <span class="pbtn">Next<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
    </div>
    <div class="lhead"><span class="kicker">Categories</span>${chipsHTML()}</div>
    ${groups.map(g => `<div class="lgrp"><i class="gdot" style="background:${cfg.cats[g]}"></i>${g} <span>(${rows.filter(r => r.cat === g).length})</span></div>` +
      rows.filter(r => r.cat === g).map(r => `<div class="lrow"><span class="ltime">${r.time}</span><span>${r.text}</span></div>`).join('')).join('')}`;
  $('#preview').querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { sel = b.dataset.f; preview(); }));
  const dd = $('#pv-sel');
  if (dd) dd.addEventListener('change', () => { sel = dd.value; preview(); });
}
function sync(rebuild = true) {
  document.body.dataset.theme = cfg.theme;
  document.body.dataset.mode = cfg.mode;
  document.body.dataset.font = cfg.font;
  document.body.style.setProperty('--accent', cfg.accent);
  save();
  if (rebuild) controls();
  preview();
}
$('#c-reset').addEventListener('click', () => { cfg = { ...DEFAULTS, cats:{ ...DEFAULTS.cats } }; sel = 'all'; sync(); });
controls();
sync(false);
</script>
</body>
</html>
