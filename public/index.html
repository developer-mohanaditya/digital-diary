<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>INK</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="logo/mark.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400..800&family=Hanken+Grotesk:wght@400..700&family=Space+Grotesk:wght@400..700&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet" />
<!-- The same stylesheet the demo links: one place for the tokens, the cards and the chips. -->
<link rel="stylesheet" href="demo/diary.css" />
</head>
<body data-theme="minimal" data-mode="light">
<script>
  // Theme and mode are settled before the header paints: a saved choice must not flash the
  // other mode, and a first visit follows the system's light/dark setting. app.js reads the
  // same key and takes over from here.
  (function () {
    var p = {};
    try { p = JSON.parse(localStorage.getItem('diary-prefs-v2') || '{}') || {}; } catch (e) {}
    if (['minimal', 'paper', 'journal'].indexOf(p.theme) < 0) p.theme = 'minimal';
    if (p.mode !== 'light' && p.mode !== 'dark') {
      p.mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    // The setup page's key is read here too, or a first visit after the import would paint the
    // theme's accent and face for a frame before app.js applied the saved ones.
    if (!localStorage.getItem('diary-prefs-v2')) {
      try {
        var old = JSON.parse(localStorage.getItem('diary-setup-v1') || '{}') || {};
        if (!p.font && old.font) p.font = old.font;
        if (!p.accent && old.accent) p.accent = old.accent;
      } catch (e) {}
    }
    document.body.dataset.theme = p.theme;
    document.body.dataset.mode = p.mode;
    if (p.font) document.body.dataset.font = p.font;
    if (p.accent) document.body.style.setProperty('--accent', p.accent);
  })();
</script>
<header class="top"><div class="top-inner">
  <a class="brand" href="#/" aria-label="INK home"><img src="logo/mark.svg" width="36" height="36" alt="INK logo" /><span class="brand-name">INK</span></a>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" class="search-input" type="search" placeholder="Search notes…" autocomplete="off" aria-label="Search notes" />
    <div class="search-pop" id="search-pop" hidden></div>
  </div>
  <div class="tools">
    <a class="iconbtn" id="nav-dash" href="#/dashboard" title="Dashboard" aria-label="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.6"/><rect x="14" y="3" width="7" height="5" rx="1.6"/><rect x="14" y="12" width="7" height="9" rx="1.6"/><rect x="3" y="16" width="7" height="5" rx="1.6"/></svg></a>
    <button class="iconbtn" id="mode-btn" data-action="mode-toggle" aria-label="Switch to dark mode" title="Light / dark"></button>
    <a class="iconbtn" href="#/settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
  </div>
</div></header>
<main>
  <section class="signin" id="signin" hidden>
    <form class="signin-card" id="signin-form">
      <img src="logo/mark.svg" width="42" height="42" alt="" />
      <h1>Your diary is locked</h1>
      <p class="muted" style="margin:0">Enter the passphrase for this diary.</p>
      <input id="signin-pass" type="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase" />
      <button class="btn" type="submit">Unlock</button>
      <p class="signin-err" id="signin-err" role="alert"></p>
    </form>
  </section>
  <div class="crumbrow" id="crumbrow" hidden>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <div class="crumbtools" id="crumbtools"></div>
  </div>
  <div id="app"><p class="muted">Loading the diary…</p></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<footer class="foot">INK · Aditya @ aweditya.com</footer>
<script type="module" src="app.js"></script>
</body>
</html>
