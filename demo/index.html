<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Digital Diary · preview</title>
<link rel="icon" href="logo/mark.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400..800&family=Hanken+Grotesk:wght@400..700&family=Space+Grotesk:wght@400..700&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet" />
<style>
  /* Palettes: theme x mode. Card shape (hard shadow) is shared by all themes. */
  [data-theme="minimal"][data-mode="light"] { --bg:#eef1ff; --ink:#0d1020; --muted:#5b6382; --accent:#4338ca; --card:#ffffff; --line:#d9ddf2; --alert:#e11d48; --edge:#0d1020; --shadow:#0d1020; --top:#0d1020; --grain:none; }
  [data-theme="minimal"][data-mode="dark"]  { --bg:#15122b; --ink:#f1eeff; --muted:#a7a1d6; --accent:#a78bfa; --card:#1e1a3d; --line:#342e66; --alert:#fb7185; --edge:#6d5bd0; --shadow:#6d5bd0; --top:#0c0a1f;
    --grain:radial-gradient(1100px 620px at 8% -12%, rgba(167,139,250,.22), transparent 60%), radial-gradient(900px 520px at 100% 0%, rgba(99,102,241,.16), transparent 60%); }
  [data-theme="paper"][data-mode="light"]   { --bg:#fbfaf6; --ink:#24231f; --muted:#8b877d; --accent:#c26a3d; --card:#ffffff; --line:#ebe7dd; --alert:#e0454b; --edge:#24231f; --shadow:#e3dccb; --top:#2b2a26; --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  [data-theme="paper"][data-mode="dark"]   { --bg:#1d1a16; --ink:#f3ece0; --muted:#a39a8a; --accent:#e0a46b; --card:#26221d; --line:#3d362d; --alert:#f07171; --edge:#5a5044; --shadow:#5a5044; --top:#14110d; --grain:none; }
  [data-theme="journal"][data-mode="light"] { --bg:#f5f2ea; --ink:#1c1f26; --muted:#6b7280; --accent:#b7791f; --card:#ffffff; --line:#e3e0d8; --alert:#dc2626; --edge:#1c1f26; --shadow:#e2b96e; --top:#1c1f26; --grain:none; }
  [data-theme="journal"][data-mode="dark"]  { --bg:#14161b; --ink:#ece9e2; --muted:#8a8f9a; --accent:#f0b66a; --card:#1d2027; --line:#2c303a; --alert:#ff6b6b; --edge:#3a3f4b; --shadow:#f0b66a; --top:#0f1115; --grain:none; }

  /* Fonts. Minimal and Dark Journal use Grotesk; Paper uses its own pair. Minimal font is unchanged. */
  [data-theme="minimal"], [data-theme="journal"] { --head:"Space Grotesk", Arial, sans-serif; --font:"Instrument Sans", Arial, sans-serif; }
  [data-theme="paper"] { --head:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; --font:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif; }

  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background-color:var(--bg); background-image:var(--grain);
    color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.5; transition:background-color .25s, color .25s; }
  h1,h2,.brand { font-family:var(--head); letter-spacing:-0.01em; }
  a { color:inherit; text-decoration:none; }
  button, select, textarea { font:inherit; }

  .top { position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; gap:14px;
    padding:12px 24px; background:var(--top); color:#f5f5ff; }
  .brand { font-weight:800; font-size:1.05rem; display:inline-flex; align-items:center; gap:10px; }
  .brand img { display:block; width:36px; height:36px; border-radius:10px; }
  .tools { display:flex; gap:8px; align-items:center; }
  .theme-wrap { position:relative; }
  .iconbtn { width:36px; height:36px; border-radius:999px; display:grid; place-items:center; cursor:pointer;
    background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.18); color:#f5f5ff; padding:0; }
  .iconbtn:hover, .iconbtn[aria-expanded="true"] { border-color:#f5f5ff; }
  .iconbtn svg { width:18px; height:18px; }
  .menu { position:absolute; right:0; top:44px; min-width:220px; background:var(--card); color:var(--ink);
    border:2px solid var(--edge); box-shadow:4px 4px 0 var(--shadow); border-radius:14px; padding:6px; z-index:10; }
  .menu[hidden] { display:none; }
  .menu button { display:flex; width:100%; align-items:center; justify-content:space-between; gap:12px; background:none; border:0;
    padding:9px 10px; border-radius:10px; color:inherit; cursor:pointer; text-align:left; font-size:.92rem; }
  .menu button:hover { background:var(--bg); }
  .menu button[aria-checked="true"] { font-weight:700; }
  .sw { display:inline-flex; gap:3px; }
  .sw i { width:10px; height:10px; border-radius:50%; display:block; }

  main { flex:1; width:min(1100px,100%); margin:0 auto; padding:16px 24px 40px; }
  .crumbs { display:flex; gap:6px; align-items:center; font-size:.76rem; color:var(--muted); margin-bottom:14px; letter-spacing:.01em; }
  .crumbs a:hover { color:var(--accent); }
  .crumbs .sep { opacity:.5; }

  .card { background:var(--card); border:2px solid var(--edge); box-shadow:4px 4px 0 var(--shadow); border-radius:18px; padding:18px 20px; margin-bottom:18px; }
  .card h2 { margin:0 0 12px; font-size:1.05rem; font-weight:700; }
  .kicker { font-size:.7rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); font-weight:700; }
  .hero h1 { font-size:clamp(1.9rem,4.4vw,2.9rem); margin:4px 0 6px; line-height:1.05; font-weight:800; letter-spacing:-.02em; }
  .muted { color:var(--muted); }

  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:18px; }
  .kpi { background:var(--card); border:2px solid var(--edge); box-shadow:4px 4px 0 var(--shadow); border-radius:18px; padding:14px 16px; }
  .kpi b { display:block; font-family:var(--head); font-size:1.8rem; font-weight:800; }
  .kpi span { font-size:.8rem; color:var(--muted); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .grid2 > .card { min-width:0; }
  @media (max-width:800px) { .grid2 { grid-template-columns:1fr; } .top { padding:12px 16px; } main { padding:14px 16px 36px; } }

  .navrow { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .seg { display:inline-flex; gap:2px; padding:3px; border-radius:999px; border:1.5px solid var(--line); background:var(--bg); }
  .seg button { background:transparent; border:0; color:var(--muted); border-radius:999px; padding:4px 12px; cursor:pointer; font-size:.85rem; }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--card); }
  .btn { background:var(--card); color:var(--ink); border:1.5px solid var(--line); border-radius:10px; padding:5px 12px; cursor:pointer; font-size:.88rem; display:inline-block; }
  .btn:hover { border-color:var(--accent); }
  .link { background:none; border:0; color:var(--accent); cursor:pointer; padding:0; font-weight:700; font-size:.82rem; }

  .chart { width:100%; height:auto; display:block; }
  .chart .grid { stroke:var(--line); stroke-dasharray:2 4; }
  .chart .axis { fill:var(--muted); font-size:11px; font-family:var(--font); }
  .chart .bar { fill:var(--accent); }
  .chart .out { fill:var(--alert); }
  .comp .bar { display:flex; height:10px; border-radius:99px; overflow:hidden; background:var(--line); gap:2px; }
  .comp .bar span { height:100%; }
  .keys { display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:12px; font-size:.86rem; }
  .k { display:inline-flex; align-items:center; gap:7px; }
  .k i { width:8px; height:8px; border-radius:50%; }
  .k em { font-style:normal; color:var(--muted); font-variant-numeric:tabular-nums; }
  .donut { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .donut svg { width:150px; height:150px; flex-shrink:0; }
  .donut .comp { flex:1; min-width:200px; }
  .donut .comp .bar { display:none; }
  .donut .keys { flex-direction:column; gap:8px; margin-top:0; }
  .dtot { font-family:var(--head); font-size:22px; font-weight:800; fill:var(--ink); }

  .folders { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .folder { background:var(--card); border:2px solid var(--edge); box-shadow:3px 3px 0 var(--shadow); border-radius:16px; padding:12px 14px; }
  .folder:hover { transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--accent); }
  .folder strong { display:block; font-family:var(--head); font-size:1.02rem; }
  .folder span { font-size:.82rem; color:var(--muted); }
  .folder.off { opacity:.4; pointer-events:none; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }

  .heat { display:grid; gap:4px; max-width:100%; overflow:hidden; }
  .heat .hrow { display:grid; grid-template-columns:34px repeat(31, minmax(0,1fr)); gap:3px; align-items:center; }
  .hm { font-size:.7rem; color:var(--muted); }
  .hc { width:100%; aspect-ratio:1; border-radius:2px; background:var(--line); outline:1px solid color-mix(in srgb, var(--ink) 8%, transparent); outline-offset:-1px; }
  .hc.l1 { background:color-mix(in srgb, var(--accent) 30%, var(--card)); }
  .hc.l2 { background:color-mix(in srgb, var(--accent) 55%, var(--card)); }
  .hc.l3 { background:color-mix(in srgb, var(--accent) 80%, var(--card)); }
  .hc.l4 { background:var(--accent); }
  .hc.na { opacity:.25; pointer-events:none; }
  .hc.blank { background:transparent; }

  .cal { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
  .dow { font-size:.72rem; color:var(--muted); text-align:center; }
  .cell { min-width:0; min-height:64px; border:1.5px solid var(--line); border-radius:12px; padding:6px 8px; display:flex; flex-direction:column; justify-content:space-between; background:var(--bg); }
  .cell:hover { border-color:var(--accent); }
  .cell b { font-weight:700; }
  .cell small { font-size:.72rem; color:var(--muted); }
  .cell.blank { border:none; background:transparent; }
  .cell.l1 { background:color-mix(in srgb, var(--accent) 22%, var(--card)); }
  .cell.l2 { background:color-mix(in srgb, var(--accent) 40%, var(--card)); }
  .cell.l3 { background:color-mix(in srgb, var(--accent) 60%, var(--card)); }
  .cell.l4 { background:color-mix(in srgb, var(--accent) 80%, var(--card)); color:#fff; }
  .cell.l4 small { color:#fff; }

  .summary p { margin:0 0 8px; }
  .summary .note { font-size:.8rem; color:var(--muted); }

  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .tab { background:var(--bg); color:var(--ink); border:1.5px solid var(--line); border-radius:999px; padding:5px 12px; cursor:pointer; font-size:.88rem; }
  .tab:hover { border-color:var(--accent); }
  .tab[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tab small { opacity:.75; margin-left:5px; }
  .tab.zero { opacity:.45; }

  .entry { background:var(--card); border:2px solid var(--edge); box-shadow:4px 4px 0 var(--shadow); border-left:10px solid var(--c); border-radius:18px; padding:14px 16px; margin-bottom:12px; }
  .meta { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:.8rem; color:var(--muted); }
  .time { font-variant-numeric:tabular-nums; font-weight:700; color:var(--ink); }
  .chip { background:var(--c); color:#fff; border-radius:6px; padding:1px 8px; font-weight:700; font-size:.76rem; }
  .mode { border:1.5px solid var(--line); border-radius:999px; padding:0 8px; font-size:.74rem; }
  .rawtag { margin-left:auto; background:transparent; border:1.5px dashed var(--line); color:var(--muted); border-radius:999px; padding:0 10px; font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
  .rawtag:hover { border-color:var(--accent); color:var(--accent); }
  .rawtag[aria-pressed="true"] { border-style:solid; border-color:var(--accent); color:var(--accent); }
  .entry p { margin:8px 0 0; font-size:1rem; white-space:pre-wrap; }
  .raw { margin-top:10px; padding:10px 12px; border-radius:12px; background:var(--bg); border:1.5px dashed var(--line); }
  .raw p { color:var(--ink); font-size:.94rem; }
  .actions { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px; font-size:.8rem; color:var(--muted); }
  .actions label { display:flex; gap:8px; align-items:center; }

  select, textarea { color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:10px; padding:6px 8px; }
  textarea { width:100%; min-height:72px; resize:vertical; }
  .add { display:grid; gap:10px; }
  .add .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .duewrap { position:relative; display:inline-flex; }
  .duewrap[hidden] { display:none; }
  .duebtn { display:inline-flex; gap:7px; align-items:center; }
  .duebtn svg { width:14px; height:14px; }
  .duepop { position:absolute; right:0; bottom:calc(100% + 8px); z-index:20; width:264px; max-width:calc(100vw - 24px); background:var(--card); color:var(--ink);
    border:2px solid var(--edge); box-shadow:4px 4px 0 var(--shadow); border-radius:14px; padding:10px 12px 8px; }
  .duepop[hidden] { display:none; }
  .dhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .dhead strong { font-size:.9rem; }
  .dhead .btn { padding:2px 10px; }
  .dgrid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .dbtn { aspect-ratio:1; border:1.5px solid transparent; background:none; color:inherit; border-radius:8px; cursor:pointer; font-size:.8rem; padding:0; }
  .dbtn:hover { border-color:var(--accent); }
  .dbtn.today { border-color:var(--line); }
  .dbtn.sel { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:800; }
  .dfoot { display:flex; justify-content:space-between; margin-top:8px; }

  .strip { display:grid; grid-template-columns:repeat(24,1fr); gap:3px; align-items:end; height:64px; }
  .strip div { background:var(--line); border-radius:4px 4px 0 0; min-height:3px; }
  .strip div.has { background:var(--accent); }
  .ticks { display:grid; grid-template-columns:repeat(24,1fr); gap:3px; font-size:.65rem; color:var(--muted); text-align:center; margin-top:4px; }
  .outlier-list { margin:12px 0 0; padding:0; list-style:none; font-size:.88rem; }
  .outlier-list li { padding:8px 0; border-top:1px solid var(--line); }
  .outlier-list .tag { color:var(--alert); font-weight:700; }

  /* Small screens: keep wide grids readable instead of squashing them. */
  @media (max-width:600px) {
    .top { padding:10px 12px; }
    .brand { font-size:.95rem; }
    main { padding:12px 12px 32px; }
    .card { padding:14px 14px; border-radius:16px; }
    .hero h1 { font-size:1.75rem; }
    .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .kpi b { font-size:1.5rem; }
    .heat .hrow { grid-template-columns:28px repeat(31, minmax(0,1fr)); gap:2px; }
    .cal { gap:4px; }
    .cell { padding:4px 5px; border-radius:10px; aspect-ratio:auto; min-height:52px; }
    .cell small { font-size:.62rem; }
    .donut { flex-direction:column; align-items:flex-start; }
    .donut svg { width:120px; height:120px; }
    .strip, .ticks { gap:2px; }
    .add .row { flex-direction:column; align-items:stretch; }
    .actions { flex-direction:column; align-items:flex-start; }
    .menu { right:-4px; max-width:calc(100vw - 24px); }
  }

  .lhead { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .lgrp { font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:800; margin:14px 0 2px; }
  .lgrp:first-child { margin-top:0; }
  .lgrp .n { opacity:.7; font-weight:400; }
  .ledg { border-bottom:1px solid var(--line); }
  .lrow { display:flex; gap:10px; padding:7px 2px; border-top:1px solid var(--line); align-items:baseline; }
  .lrow:first-child { border-top:0; }
  .ltime { flex:0 0 44px; font-size:.78rem; color:var(--muted); font-variant-numeric:tabular-nums; }
  .ltime.wide { flex-basis:82px; }
  .ltxt { flex:1; min-width:0; }
  .ltxt.clamp { overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .ltag { font-size:.66rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase; border:1.5px dashed var(--line); color:var(--muted); border-radius:999px; padding:0 8px; cursor:pointer; background:none; margin-left:8px; }
  .ltag:hover { border-color:var(--accent); color:var(--accent); }
  .ltag.solid { border-style:solid; }
  .lmore { font-size:.76rem; font-weight:700; color:var(--accent); background:none; border:0; cursor:pointer; padding:0; margin-left:8px; }
  .lmove { flex:0 0 auto; font-size:.74rem; font-weight:700; color:var(--muted); background:none; border:0; cursor:pointer; padding:2px 4px; opacity:0; }
  .lrow:hover .lmove, .lrow:focus-within .lmove { opacity:1; }
  @media (hover:none) { .lmove { opacity:.55; } }
  .lmove:hover { color:var(--accent); }
  .lmove-open { flex:0 0 auto; font-size:.78rem; color:var(--muted); display:flex; gap:6px; align-items:center; }
  .lraw { margin:0 0 4px 54px; padding:8px 10px; border-radius:10px; background:var(--bg); border:1.5px dashed var(--line); }
  .lraw p { margin:4px 0 0; font-size:.88rem; }

  .lrow.clickable { cursor:pointer; border-radius:10px; }
  .lrow.clickable:hover { background:color-mix(in srgb, var(--accent) 7%, transparent); }
  .lrow.clickable:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .overlay { position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:20px; }
  .backdrop { position:absolute; inset:0; background:rgba(10,10,25,.5); }
  .sheet { position:relative; width:min(560px,100%); min-height:min(360px,68vh); max-height:82vh; overflow:auto; background:var(--card); color:var(--ink);
    border:2px solid var(--edge); box-shadow:6px 6px 0 var(--shadow); border-radius:18px; padding:20px 22px 28px; }
  .shead { display:flex; align-items:center; gap:10px; }
  .shead .mode { font-size:.74rem; }
  .sdot { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .xbtn { margin-left:auto; background:none; border:1.5px solid #cf7d7d; color:#b05050; border-radius:10px; width:32px; height:32px; cursor:pointer; font-size:1.35rem; line-height:1; flex-shrink:0; transition:background .15s, color .15s, border-color .15s; }
  .xbtn:hover { border-color:#a93e3e; color:#fff; background:#c05a5a; }
  .smeta { font-size:.8rem; color:var(--muted); margin:6px 0 10px; font-variant-numeric:tabular-nums; }
  .sfull { font-size:1.05rem; margin:0 0 14px; white-space:pre-wrap; }
  .due { display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.02em; border-radius:999px; padding:1px 9px; border:1.5px solid var(--line); color:var(--muted); white-space:nowrap; }
  .due.soon { border-color:#b7791f; color:#8a5a12; background:color-mix(in srgb, #e8a33d 14%, transparent); }
  .due.over { border-color:#c05a5a; color:#a93e3e; background:color-mix(in srgb, #e5484d 10%, transparent); }
  .due.done { border-color:var(--line); color:var(--muted); }
  .duline { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:.88rem; margin:0 0 12px; }
  .stitle { font-size:1.12rem; line-height:1.35; margin:0 0 6px; letter-spacing:-.01em; }
  .sfigure { margin:0 0 14px; border-radius:14px; overflow:hidden; border:1.5px solid var(--line); background:#101223; }
  .sfigure img { display:block; width:100%; height:auto; max-height:46vh; object-fit:contain; }
  .sraw { margin:8px 0 14px; padding:10px 12px; border-radius:12px; background:var(--bg); border:1.5px solid var(--line); }
  .sraw p { margin:4px 0 0; font-size:.94rem; }
  .smove { display:flex; gap:8px; align-items:center; font-size:.88rem; color:var(--muted); margin-top:12px; }

  .gdot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:7px; }
  .hbtn { background:none; border:1.5px solid var(--line); color:var(--muted); border-radius:10px; width:32px; height:32px; cursor:pointer;
    display:inline-grid; place-items:center; font-size:.8rem; font-weight:800; font-family:ui-monospace, monospace; flex-shrink:0; padding:0; }
  .hbtn:hover { border-color:var(--accent); color:var(--accent); }
  .hbtn[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');

const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };

  const total = Object.values(w).reduce((a,b) => a+b, 0);

function rawOf(text, mode, r) {

  const f = fillers[Math.floor(r() * fillers.length)];

      const text = pool[Math.floor(r() * pool.length)];

        id: `${k}-${i}`,
        time: `${pad(pickHour(r))}:${pad(Math.floor(r() * 60))}`,
        cat, mode,
        src: r() < 0.15 ? 'tag' : 'auto',
        text,
        raw: rawOf(text, mode, r),

    const di = Object.keys(days).length;

      const text = pool[di % pool.length];

        id: `${k}-dl`,
        time: `${pad(9 + (di % 9))}:${pad((di * 7) % 60)}`,

let state = loadState();
// Photo flags arrived with the ledger view. Backfill stored days deterministically.

/* Preferences: theme (Minimal default, Paper, Dark Journal) and light/dark mode. */

const MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const THEMES = ['minimal', 'paper', 'journal'];

if (!['light', 'dark'].includes(prefs.mode)) prefs.mode = 'light';

function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (p[0] === 'y' && p[1] && p[2] === 'm' && p[3]) {
    const y = +p[1], m = +p[3];

function bounds() {
  const a = parse(ui.anchor);

/* ---------- Charts (plain SVG) ---------- */
function stackChart(bks, label) {
  const W = 720, H = 240, P = 30, B = 24;
  const totals = bks.map(b => Object.values(b.counts).reduce((a, c) => a + c, 0));
  const max = Math.max(1, ...totals);
  const plotH = H - P - B, slot = (W - P * 2) / bks.length, bw = Math.min(22, slot * 0.58);
  const every = Math.ceil(bks.length / 12);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  for (let i = 0; i <= 4; i++) {
    const y = P + plotH - plotH * i / 4;
    s += `<line class="grid" x1="${P}" x2="${W-P}" y1="${y}" y2="${y}"/><text class="axis" x="${P-8}" y="${y+4}" text-anchor="end">${Math.round(max*i/4)}</text>`;
  }
  bks.forEach((b, i) => {
    const cx = P + slot * i + slot / 2, x = cx - bw / 2;

// Category composition: one slim proportional bar plus text keys (no boxes).
function compHTML(counts) {

  const act = CATS.filter(c => counts[c.id]);
  const bar = act.map(c => `<span style="flex:${counts[c.id]};background:${c.color}" title="${c.label}: ${counts[c.id]}"></span>`).join('');
  const keys = act.map(c => `<span class="k"><i style="background:${c.color}"></i>${c.label}<em>${counts[c.id]} · ${Math.round(counts[c.id] / total * 100)}%</em></span>`).join('');

function monthCalendar(y, m) {

  for (let i = 0; i < lead; i++) cells += '<span class="cell blank"></span>';

function donut(counts) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0);

  const C = 2 * Math.PI * 40; let cum = 0, arcs = '';

    arcs += `<circle r="40" cx="60" cy="60" fill="none" stroke="${c.color}" stroke-width="16" stroke-dasharray="${f*C} ${C}" stroke-dashoffset="${-cum*C}" transform="rotate(-90 60 60)"><title>${c.label}: ${n}</title></circle>`;

function monthSummary(y, m) {

  return `<div class="summary">

}

/* Deadlines carry their own schema: a due date plus done flag, rendered as status pills. */
function dueDays(due) { return Math.round((parse(due) - parse(TODAY)) / 864e5); }
function duePill(it) {

  if (!it.due) return '';
  const n = dueDays(it.due);
  if (n < 0) return `<span class="due over">Overdue ${-n}d</span>`;
  if (n === 0) return '<span class="due soon">Due today</span>';
  if (n === 1) return '<span class="due soon">Due tomorrow</span>';
  return `<span class="due soon">Due in ${n}d</span>`;
}
function dueLine(it) {

  const n = it.due ? dueDays(it.due) : null;
  const st = it.done ? 'Done' : n === null ? '' : n < 0 ? `${-n} days overdue` : n === 0 ? 'due today' : `${n} days left`;
  return `<div class="duline">${duePill(it)}<span class="muted">${esc(when)}${st ? ` · ${st}` : ''}</span></div>`;
}
function entryHTML(it, k) {

}

    cat: chosen || 'inbox',
    mode: $('#add-mode').value,
    src: chosen ? 'manual' : 'auto',
    text,
    raw: text,
  };
  if (it.cat === 'deadline') { it.due = $('#add-due').value || iso(addDays(new Date(), 7)); it.done = false; }
  state.days[k] = [...items(k), it].sort((a, b) => a.time.localeCompare(b.time));
  ui.duePick = '';
  saveState(); render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]'); if (!t) return;
  const a = t.dataset.action, v = t.dataset.v;
  if (a === 'mode-toggle') { prefs.mode = prefs.mode === 'light' ? 'dark' : 'light'; applyPrefs(); savePrefs(); }
  else if (a === 'theme-menu') setMenu($('#theme-menu').hidden);
  else if (a === 'theme') { prefs.theme = v; applyPrefs(); savePrefs(); setMenu(false); }
  else if (a === 'range') { ui.range = v; render(); }
  else if (a === 'shift') { if (v === '0') ui.anchor = TODAY; else shiftAnchor(+v); render(); }
  else if (a === 'tab') { ui.tab = v; render(); }
  else if (a === 'raw') { ui.openRaw.has(v) ? ui.openRaw.delete(v) : ui.openRaw.add(v); render(); }
  else if (a === 'move') { ui.openMove.add(v); render(); }
  else if (a === 'layout') { ui.layout = v; render(); }
  else if (a === 'more') { ui.openFull.has(v) ? ui.openFull.delete(v) : ui.openFull.add(v); render(); }
  else if (a === 'open') { ui.openNote = v; ui.moveMenu = false; ui.moveConfirm = null; render(); }
  else if (a === 'close-note') { ui.openNote = null; ui.moveMenu = false; ui.moveConfirm = null; render(); }
  else if (a === 'move-menu') { ui.moveMenu = !ui.moveMenu; ui.moveConfirm = null; render(); }
  else if (a === 'move-to') { ui.moveConfirm = v; render(); }
  else if (a === 'move-no') { ui.moveConfirm = null; render(); }
  else if (a === 'move-yes') { const f = ui.openNote && findNote(ui.openNote); if (f && ui.moveConfirm) doMove(f.k, f.it.id, ui.moveConfirm); ui.moveConfirm = null; ui.moveMenu = false; render(); }
  else if (a === 'due-toggle') { ui.dueOpen = !ui.dueOpen; if (ui.dueOpen && !ui.dueCal) ui.dueCal = (ui.duePick || TODAY).slice(0, 7); renderDuePop(); }
  else if (a === 'due-prev') { shiftDueCal(-1); renderDuePop(); }
  else if (a === 'due-next') { shiftDueCal(1); renderDuePop(); }
  else if (a === 'due-day') { setDuePick(v); ui.dueOpen = false; renderDuePop(); }
  else if (a === 'due-today') { setDuePick(TODAY); ui.dueCal = TODAY.slice(0, 7); ui.dueOpen = false; renderDuePop(); }
  else if (a === 'due-clear') { setDuePick(''); ui.dueOpen = false; renderDuePop(); }
  else if (a === 'add') addEntry();
});
document.addEventListener('change', e => {
  if (e.target.id === 'add-cat') { const w = document.querySelector('.duewrap'); if (w) w.hidden = e.target.value !== 'deadline'; }
  const s = e.target.closest('[data-move]'); if (!s) return;
  const [k, id] = s.dataset.move.split('|');
  const it = items(k).find(x => x.id === id);
  if (it) { it.cat = s.value; it.src = 'manual'; ui.openMove.delete(id); saveState(); render(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.theme-wrap')) setMenu(false); if (ui.dueOpen && e.target.isConnected && !e.target.closest('.duewrap')) { ui.dueOpen = false; renderDuePop(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { setMenu(false); if (ui.dueOpen) { ui.dueOpen = false; renderDuePop(); } if (ui.openNote) { ui.openNote = null; render(); } return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target instanceof Element) {
    const t = e.target.closest('[data-action="open"]');
    if (t) { e.preventDefault(); ui.openNote = t.dataset.v; render(); }
  }
});
window.addEventListener('hashchange', () => { ui.tab = 'all'; ui.openNote = null; render(); window.scrollTo(0, 0); });

applyPrefs();
if (!location.hash) history.replaceState(null, '', '#/');
render();
</script>
</body>
</html>
