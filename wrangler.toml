name = "digital-diary"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Static preview/UI lives in public/ and is served by the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Daily "life function": writes a heartbeat so the Supabase project stays active.
[triggers]
crons = ["0 6 * * *"]

# Timezone for day grouping (IANA name). Change when you move; see the timezone setting plan.
[vars]
DIARY_TZ = "Europe/Paris"
