name = "digital-diary"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Static preview/UI lives in public/ and is served by the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Daily "life function": writes a heartbeat so the Supabase project stays active.
# Plus morning + evening sweeps for deadline/review pings.
[triggers]
crons = ["0 6 * * *", "30 12 * * *"]

# Timezone for day grouping (IANA name). Change when you move; see the timezone setting plan.
# Non-secret vars only. Secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET,
# SUPABASE_SERVICE_KEY) stay in Cloudflare dashboard / `wrangler secret put` — never here.
[vars]
DIARY_TZ = "Europe/Paris"
ALLOWED_CHAT_ID = "1353449143"
