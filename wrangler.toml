name = "ink"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Static preview/UI lives in public/ and is served by the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Workers AI cleans up each note and stores the original beside it. Short notes use
# the 8B model, long ones the 70B; see src/refine.ts. It has a free daily allowance.
[ai]
binding = "AI"

# The daily "life function": deadline and review pings on every run, the three keep-alive
# heartbeats (08:45, 12:30 and 17:00 in DIARY_TZ), and the 10pm summary.
#
# Each entry carries both the UTC hour it falls on under CEST and the one under CET; the
# Worker acts on whichever run lands on the local clock, so the beats and the summary keep
# their hour when the clocks change. The summary's hour plus the settings marker is what
# stops the pair sending twice.
#
# Four entries, because the Free plan allows five Cron Triggers per account in total.
[triggers]
crons = ["45 6,7 * * *", "30 10,11 * * *", "0 15,16 * * *", "0 20,21 * * *"]

# Timezone for day grouping (IANA name). Change when you move; see the timezone setting plan.
# Non-secret vars only. Secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET,
# SUPABASE_SERVICE_KEY) stay in Cloudflare dashboard / `wrangler secret put` — never here.
[vars]
DIARY_TZ = "Europe/Paris"
ALLOWED_CHAT_ID = "1353449143"
# Not a secret: an identifier, and the same number in production and local dev.
# The Supabase Auth user that owns every row. Set when the diary gained a login.
OWNER_USER_ID = "9d6eb0f3-6952-4260-ab9e-72d5eaf7b3b2"
# Not a secret: the Cloudflare account the Worker and its analytics belong to.
CLOUDFLARE_ACCOUNT_ID = "38e2da6c293b361d7563a76bf8e519d7"
# Not a secret: RLS keeps the data private, and the service key stays a secret.
# Kept here so every deploy carries it, instead of depending on dashboard state.
SUPABASE_URL = "https://rniszgdbwkelkjhnmvgt.supabase.co"
